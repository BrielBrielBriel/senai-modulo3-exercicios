<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Gabriel Santos">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulário</title>
    </head>
    <body>
        <h1>Cadastro de Funcionario</h1>
        <form action="#">
            
            <h2>Preencha os dados do funcionario:</h2>

            <label for="nome">Nome:</label> <br>
            <input type="text" name="nome" id="nome"> <br>

            <label for="idade">Idade:</label> <br>
            <input type="number" name="idade" id="idade"> <br>
            
            <label for="data-nasc">Data de nascimento:</label> <br>
            <input type="date" name="data-nasc" id="data-nasc"> <br>

            <label for="email">E-mail:</label> <br>
            <input type="email" name="email" id="email"> <br>

            <label for="idioma">Idioma:</label> <br>
            <select name="" id="">
                <option value="EN">Inglês</option>
                <option value="pt-BR">Português</option>
                <option value="ES">Espanhol</option>
            </select> <br>

            <label for="sexo">Sexo:</label>
            
            <input type="radio" name="sexo" id="masculino">
                <label for="masculino">Masculino</label>
            
            <input type="radio" name="sexo" id="feminino">
                <label for="feminino">Feminino</label>
            
            <input type="radio" name="sexo" id="outro">
                <label for="outro">Outro</label>
            
            <br>

            <input type="submit">
            <input type="reset">
        </form>
    </body>
</html>
