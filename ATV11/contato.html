<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="assets/css/style.css">
        <script type="module" src="assets/js/script3.js"></script>
        <title>Contato</title>
    </head>
    <body id="corpo-contato">
        <header>
            <section class="logo">
                <h1>Tech Solutions</h1>
            </section>
            
            <div id="modo-claro-contato" class="modo-claro" title="Modo Claro"></div>
            <div id="reset-contato" class="resetar" title="Resetar"></div>
            <div id="modo-escuro-contato" class="modo-escuro" title="Modo Claro"></div>
            
            <nav>
                <a href="index.html">Início</a>
                <a href="servicos.html">Serviços</a>
                <a href="contato.html">Contato</a>
            <nav>
        </header>

        <main>
            <h2 id="titulo-contato">Gostou dos nossos serviços?</h2>
            
            <p id="mensagem-contato">
                Preencha o formulário abaixo e nossa equipe 
                entrará em contato com você.
            </p>

            <form id="formulario" action="#">
                <div class="form-input">
                    <label for="nome">Nome: </label>
                    <input type="text" name="nome" id="nome">
                </div>
                
                <div class="form-input">
                    <label for="email">E-mail: </label>
                    <input type="email" name="email" id="email">
                </div>
                    
                <div class="form-input">
                    <label for="assunto">Assunto:</label>
                    <input type="text" name="assunto" id="assunto">
                </div>

                <div id="area-mensagem" class="form-input">
                    <label for="mensagem">Deixe uma mensagem: </label>
                    <textarea name="mensagem" id="mensagem"></textarea>
                </div>

                <input type="submit" id="botao-contato" class="botao">
            </form>
        </main>

        <footer>
            <p>© 2026 - </p>
            <p>TechSolutions</p>
        </footer>
    </body>
</html>
