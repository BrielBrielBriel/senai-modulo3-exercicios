<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Gabriel Santos">
        <link rel="stylesheet" href="style.css">
        <title>Tech School - Contato</title>
    </head>
    <body>
        <header>
            <div class="logo-area">
                <img src="./imagens/logo.png" alt="Logo da Tech Escola">
                <h1>Tech School</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="cursos.html">Cursos</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </header>
        
        <main>
            <section class="pagina-titulo">
                <h2>Entre em contanto</h2>
                <p>Preencha o formulario abaixo para saber mais sobre nossos cursos</p>
            </section>

            <section class="formulario-container">
                <form action="#">
                    <div class="campo">
                        <label for="nome">Nome: </label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                    </div>
                    <div class="campo">
                        <label for="email">E-mail: </label>
                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone: </label>
                        <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone">
                    </div>

                    <div class="campo">
                        <label for="curso">Curso de interesse: </label>
                        <select name="curso" id="campo">
                            <option value="">Selecione um curso</option>
                            <option value="web">Desenvolvimento Web</option>
                            <option value="banco">Banco de Dados</option>
                            <option value="logica">Programação</option>
                        </select>
                    </div>

                    <div class="campo">
                        <fieldset>
                            <legend>Modalidade: </legend>
                            <div class="opcao">
                                <input type="radio" id="presencial" name="modalidade" value="presencial">
                                <label for="presencial">Presencial</label>
                            </div>
                            <div class="opcao">
                                <input type="radio" id="online" name="modalidade" value="online">
                                <label for="online">Online</label>
                            </div>
                        </fieldset>

                        <fieldset>
                            <legend>Assuntos de interesse: </legend>

                            <div class="opcao">
                                <input type="checkbox" name="assuntos" id="cursos" value="cursos">
                                <label for="cursos">Cursos</label>
                            </div>

                            <div class="opcao">
                                <input type="checkbox" id="valores" name="assuntos" value="valores">
                                <label for="valores">Valores</label>
                            </div>

                            <div class="opcao">
                                <input type="checkbox" id="matricula" name="assuntos" value="matricula">
                                <label for="matricula">Matricula</label>
                            </div>

                            <div class="opcao">
                                <input type="checkbox" id="outros" name="assuntos" value="outros">
                                <label for="outros">Outros</label>
                            </div>
                        </fieldset>

                        <div class="campo">
                            <label for="mensagem">Mensagem: </label>
                            <textarea name="mensagem" id="mensagem" rows="6" placeholder="Digite uma mensagem"></textarea>
                        </div>

                        <div class="botoes">
                            <button type="reset">Limpar</button>
                            <button type="submit">Enviar</button>
                        </div>
                    </div>
                </form>
            </section>
        </main>

        <footer>
            <p>©Escola TechSchool - Escola de tecnologia</p>
            <p>escola.tech@email.com</p>
        </footer>
    </body>
</html>
